<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Walmart Smart Business Analytics — Enterprise BI Platform</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy:#0B1220;
  --navy-2:#101a2e;
  --navy-3:#16223a;
  --blue:#2563EB;
  --cyan:#22D3EE;
  --teal:#14B8A6;
  --text:#E6EDF7;
  --text-dim:#8FA3BF;
  --line:rgba(99,140,200,.14);
  --line-2:rgba(99,140,200,.25);
  --good:#22C55E;
  --warn:#F59E0B;
  --bad:#EF4444;
  --radius:16px;
  --shadow:0 18px 50px rgba(2,8,20,.55);
  --glow:0 0 24px rgba(34,211,238,.25);
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:radial-gradient(1200px 600px at 80% -10%,rgba(37,99,235,.18),transparent 60%),
             radial-gradient(900px 500px at 0% 110%,rgba(20,184,166,.10),transparent 55%),
             var(--navy);
  color:var(--text);
  overflow-x:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,140,200,.28);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.4)}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{
  width:268px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(16,26,46,.96),rgba(11,18,32,.96));
  border-right:1px solid var(--line);
  backdrop-filter:blur(16px);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:width .35s cubic-bezier(.4,0,.2,1);
  z-index:40;
}
.sidebar.collapsed{width:78px}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid var(--line)}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;
  box-shadow:var(--glow);
  letter-spacing:-1px;
}
.brand-text{white-space:nowrap;overflow:hidden}
.brand-text h1{font-size:14px;font-weight:800;letter-spacing:.2px}
.brand-text span{font-size:10.5px;color:var(--cyan);letter-spacing:2.4px;font-weight:600}
.sidebar.collapsed .brand-text{display:none}

.nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav-group-label{
  font-size:10px;letter-spacing:2px;color:var(--text-dim);
  padding:14px 12px 8px;font-weight:700;text-transform:uppercase;
}
.sidebar.collapsed .nav-group-label{visibility:hidden;height:18px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:11px;cursor:pointer;
  color:var(--text-dim);font-size:13.5px;font-weight:500;
  transition:all .22s ease;position:relative;white-space:nowrap;
  border:1px solid transparent;
}
.nav-item:hover{background:rgba(37,99,235,.12);color:var(--text);transform:translateX(2px)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(37,99,235,.28),rgba(34,211,238,.08));
  color:#fff;border-color:rgba(34,211,238,.28);
  box-shadow:inset 3px 0 0 var(--cyan);
}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.sidebar.collapsed .nav-item span{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:12px 0}

.sidebar-footer{padding:14px;border-top:1px solid var(--line)}
.ai-status{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-dim)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:35;
  display:flex;align-items:center;gap:16px;
  padding:14px 26px;
  background:rgba(11,18,32,.78);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  color:var(--text-dim);cursor:pointer;transition:.2s;flex-shrink:0;
}
.icon-btn:hover{color:var(--cyan);border-color:var(--line-2);background:rgba(34,211,238,.1)}
.topbar h2{font-size:16.5px;font-weight:700;letter-spacing:.2px}
.topbar .crumb{font-size:11px;color:var(--text-dim);margin-top:2px}
.topbar-spacer{flex:1}

/* Search */
.search{position:relative;width:300px;max-width:38vw}
.search input{
  width:100%;padding:10px 14px 10px 38px;border-radius:11px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:.2s;
}
.search input:focus{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-dim)}

/* Date filter */
.date-filter{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:5px 10px}
.date-filter select{
  background:transparent;border:none;color:var(--text);font-family:var(--font);
  font-size:12.5px;outline:none;cursor:pointer;
}
.date-filter select option{background:var(--navy-2);color:var(--text)}
.date-filter label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}

/* Notification */
.notif-wrap{position:relative}
.notif-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--navy)}
.notif-panel{
  position:absolute;right:0;top:48px;width:340px;max-height:420px;overflow-y:auto;
  background:var(--navy-2);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);padding:8px;display:none;z-index:60;
}
.notif-panel.open{display:block;animation:drop .25s ease}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.notif-item{display:flex;gap:10px;padding:11px;border-radius:9px;transition:.2s;cursor:pointer}
.notif-item:hover{background:rgba(255,255,255,.04)}
.notif-item .n-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.notif-item h5{font-size:12.5px;font-weight:600;margin-bottom:2px}
.notif-item p{font-size:11px;color:var(--text-dim);line-height:1.4}
.notif-item .time{font-size:10px;color:var(--text-dim);margin-top:3px;display:block}

/* User */
.user{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:11px;cursor:pointer;transition:.2s}
.user:hover{background:rgba(255,255,255,.05)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.user-info{line-height:1.2}
.user-info b{font-size:12.5px;display:block}
.user-info span{font-size:10.5px;color:var(--text-dim)}

/* ============ CONTENT ============ */
.content{padding:24px 26px 60px;flex:1}
.page{display:none}
.page.active{display:block;animation:fadeUp .45s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.page-head h3{font-size:22px;font-weight:800;letter-spacing:-.3px}
.page-head p{color:var(--text-dim);font-size:13px;margin-top:4px;max-width:640px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;font-size:12.5px;font-weight:600;
  cursor:pointer;border:1px solid var(--line-2);background:rgba(255,255,255,.04);
  color:var(--text);transition:.22s;font-family:var(--font);
}
.btn:hover{border-color:rgba(34,211,238,.5);color:var(--cyan);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--blue),#3b82f6);border-color:transparent;box-shadow:0 8px 22px rgba(37,99,235,.4)}
.btn.primary:hover{color:#fff;box-shadow:0 10px 28px rgba(37,99,235,.6)}
.btn svg{width:15px;height:15px}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-bottom:22px}
.kpi{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(22,34,58,.92),rgba(16,26,46,.92));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;transition:.3s;cursor:default;
}
.kpi:hover{transform:translateY(-4px);border-color:rgba(34,211,238,.35);box-shadow:0 16px 40px rgba(2,8,20,.6)}
.kpi::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 100% 0%,rgba(34,211,238,.12),transparent 70%);pointer-events:none;opacity:0;transition:.35s}
.kpi:hover::after{opacity:1}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.kpi-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.kpi-label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-1px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;gap:6px;font-size:11.5px}
.trend{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-weight:700;font-size:11px}
.trend.up{color:var(--good);background:rgba(34,197,94,.12)}
.trend.down{color:var(--bad);background:rgba(239,68,68,.12)}
.kpi-foot .muted{color:var(--text-dim)}

/* Chart cards */
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:18px}
.grid-2.eq{grid-template-columns:1fr 1fr}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
@media(max-width:1100px){.grid-2,.grid-2.eq,.grid-3{grid-template-columns:1fr}}
.card{
  background:linear-gradient(160deg,rgba(22,34,58,.78),rgba(16,26,46,.85));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 12px;transition:.28s;position:relative;overflow:hidden;
}
.card:hover{border-color:var(--line-2)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h4{font-size:14.5px;font-weight:700;letter-spacing:.1px}
.card-head .sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.tag{font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase}
.tag.live{color:var(--cyan);background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3)}
.tag.sim{color:var(--warn);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3)}
.tag.hist{color:var(--text-dim);background:rgba(143,163,191,.1);border:1px solid var(--line-2)}
.chart-wrap{position:relative;width:100%;height:260px}
.chart-wrap.sm{height:210px}
.chart-wrap.lg{height:320px}

/* Table */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
thead th{
  text-align:left;padding:11px 14px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--text-dim);font-weight:700;
  background:rgba(255,255,255,.025);border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid rgba(99,140,200,.07);white-space:nowrap}
tbody tr{transition:.18s;cursor:pointer}
tbody tr:hover{background:rgba(37,99,235,.09)}
tbody tr:last-child td{border-bottom:none}
.badge{padding:2.5px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge.g{color:var(--good);background:rgba(34,197,94,.12)}
.badge.w{color:var(--warn);background:rgba(245,158,11,.12)}
.badge.b{color:var(--bad);background:rgba(239,68,68,.12)}
.badge.c{color:var(--cyan);background:rgba(34,211,238,.12)}
.bar-mini{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:8px}
.bar-mini>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .8s cubic-bezier(.2,.7,.3,1)}

/* AI panel */
.ai-panel{
  background:linear-gradient(160deg,rgba(37,99,235,.14),rgba(20,184,166,.06));
  border:1px solid rgba(34,211,238,.28);border-radius:var(--radius);
  padding:20px;position:relative;overflow:hidden;
}
.ai-panel::before{
  content:"";position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.22),transparent 70%);
  top:-120px;right:-80px;animation:float 8s ease-in-out infinite;pointer-events:none;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
.ai-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ai-orb{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(from 0deg,var(--blue),var(--cyan),var(--teal),var(--blue));
  display:grid;place-items:center;animation:spin 6s linear infinite;box-shadow:var(--glow);
}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-orb span{width:30px;height:30px;border-radius:50%;background:var(--navy-2);display:grid;place-items:center;font-size:14px;animation:spin 6s linear infinite reverse}
.ai-head h4{font-size:15.5px;font-weight:800}
.ai-head p{font-size:11.5px;color:var(--text-dim)}
.insight{
  display:flex;gap:12px;padding:13px;border-radius:12px;
  background:rgba(11,18,32,.55);border:1px solid var(--line);margin-bottom:10px;
  transition:.22s;animation:fadeUp .5s both;
}
.insight:hover{border-color:rgba(34,211,238,.35);transform:translateX(3px)}
.insight .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.insight b{font-size:12.5px;display:block;margin-bottom:3px}
.insight p{font-size:11.5px;color:var(--text-dim);line-height:1.5}
.insight .conf{font-size:10px;color:var(--cyan);margin-top:5px;font-weight:600;letter-spacing:.5px}

/* Chat */
.chat-box{display:flex;flex-direction:column;height:380px}
.chat-log{flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:13px;font-size:12.5px;line-height:1.55;animation:fadeUp .3s}
.msg.bot{background:rgba(37,99,235,.16);border:1px solid rgba(34,211,238,.22);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:rgba(20,184,166,.18);border:1px solid rgba(20,184,166,.3);align-self:flex-end;border-bottom-right-radius:4px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{
  flex:1;padding:11px 14px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--text);font-size:12.5px;font-family:var(--font);outline:none;
}
.chat-input input:focus{border-color:rgba(34,211,238,.5)}
.chat-input button{
  padding:0 18px;border-radius:11px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:700;font-size:12.5px;
  font-family:var(--font);transition:.2s;
}
.chat-input button:hover{box-shadow:0 8px 22px rgba(37,99,235,.5)}

/* Data quality bars */
.dq-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dq-row .lbl{width:150px;font-size:12px;color:var(--text-dim);flex-shrink:0}
.dq-track{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.dq-track>i{display:block;height:100%;border-radius:6px;transition:width 1s cubic-bezier(.2,.7,.3,1)}
.dq-row .val{width:52px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* Source cards */
.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.source{
  padding:15px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);transition:.25s;
}
.source:hover{border-color:rgba(34,211,238,.35);transform:translateY(-2px)}
.source-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.source-top .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.source b{font-size:13px;display:block}
.source p{font-size:11.5px;color:var(--text-dim);margin-top:6px;line-height:1.5}
.source .meta{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;color:var(--text-dim)}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.heat-cell{aspect-ratio:1;border-radius:5px;transition:.2s;cursor:pointer;position:relative}
.heat-cell:hover{transform:scale(1.18);z-index:2;box-shadow:0 0 0 2px var(--cyan)}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{
  display:flex;gap:11px;align-items:center;padding:13px 16px;border-radius:12px;
  background:var(--navy-2);border:1px solid var(--line-2);box-shadow:var(--shadow);
  font-size:12.5px;min-width:260px;animation:slideIn .35s cubic-bezier(.2,.7,.3,1);
}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}

/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(2,8,20,.72);backdrop-filter:blur(6px);
  z-index:150;display:none;place-items:center;padding:20px;
}
.modal-bg.open{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;background:var(--navy-2);border:1px solid var(--line-2);
  border-radius:18px;padding:24px;box-shadow:var(--shadow);animation:fadeUp .3s;
  max-height:88vh;overflow-y:auto;
}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .m-sub{color:var(--text-dim);font-size:12.5px;margin-bottom:18px}
.modal-close{float:right;cursor:pointer;color:var(--text-dim);font-size:20px;line-height:1;transition:.2s}
.modal-close:hover{color:var(--bad)}

/* Responsive */
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);width:268px}
  .sidebar.mobile-open{transform:none;box-shadow:var(--shadow)}
  .search{width:170px}
  .user-info{display:none}
  .content{padding:18px 14px 60px}
  .topbar{padding:12px 14px}
}
@media(max-width:560px){
  .search{display:none}
  .date-filter label{display:none}
  .kpi-value{font-size:22px}
}
.mobile-only{display:none}
@media(max-width:860px){.mobile-only{display:grid}}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div class="brand-text">
        <h1>Walmart Smart</h1>
        <span>ANALYTICS</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="ai-status">
        <span class="pulse"></span>
        <span id="aiStatusTxt">AI Engine Online</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <header class="topbar">
      <button class="icon-btn" id="toggleBtn" title="Toggle sidebar" aria-label="Toggle sidebar">

  in-memory sample derived from that schema. It is DEMONSTRATION data.

*/
const DataLayer = (() => {
  const HOLIDAY_DATES = new Set([
    '2010-02-12','2010-09-10','2010-11-26','2010-12-31',
    '2011-02-11','2011-09-09','2011-11-25','2011-12-30',

  // Weekly records sampled from train.csv (Store 1, departments 1–13) + holidays
  const RAW = [

    // Store 1, Dept 7 (large holiday peaks)
    ['2010-11-26',72635.06],['2010-12-17',96198.12],['2010-12-24',166697.72],
    ['2011-11-25',71151.34],['2011-12-23',119302.15],['2012-10-26',21449.85],
    // Store 1, Dept 8
    ['2010-02-05',40129.01],['2010-12-24',41864],['2011-12-23',41062.58],['2012-10-05',42663.75],
    // Store 1, Dept 9
    ['2010-10-01',44977.91],['2010-11-05',48794.36],['2011-11-04',50675.72],['2012-03-30',50382.47],
    ['2012-09-07',42920.95],['2012-10-26',41040.84],

  ];

  const DEPT_NAMES = {1:'Electronics',2:'Grocery',3:'Seasonal',4:'Home',5:'Holiday',6:'Pharmacy',
    7:'Toys',8:'Apparel',9:'Sports',10:'Auto',11:'Pets',12:'Beauty',13:'Furniture'};

  function makeRecord(row, idx){
    const [date, sales] = row;
    const dept = (idx % 13) + 1;
    return {
      date,
      week: date,
      store: 1 + (idx % 3),
      dept,
      department: DEPT_NAMES[dept],
      sales: Number(sales),
      isHoliday: HOLIDAY_DATES.has(date),
      region: ['Southeast','Northeast','Midwest','South','West'][dept % 5],
    };
  }

  // Expand with synthetic-but-plausible series around the sample points so charts look full
  function buildTimeseries(){
    const out = [];
    const start = new Date('2010-02-05');
    const end = new Date('2012-10-26');
    const baseByDept = {1:20000,2:45000,3:15000,4:36000,5:22000,6:5000,7:26000,8:35000,9:28000,10:30000,11:25000,12:11000,13:38000};
    let d = new Date(start); let i=0;
    while(d <= end){
      const ds = d.toISOString().slice(0,10);
      for(let dept=1; dept<=13; dept++){
        const base = baseByDept[dept];
        const t = i / 52; // years
        const season = 1 + 0.22*Math.sin((i/52)*2*Math.PI - Math.PI/2);
        const holiday = HOLIDAY_DATES.has(ds) ? 1.9 : 1;
        const trend = 1 + t*0.06;
        const noise = 0.92 + ((Math.sin(i*12.9898 + dept*78.233)*43758.5453)%1+1)%1 * 0.16;
        const sales = +(base * season * holiday * trend * noise).toFixed(2);
        out.push({date:ds, store:1, dept, department:DEPT_NAMES[dept],
          sales, isHoliday:HOLIDAY_DATES.has(ds),
          region:['Southeast','Northeast','Midwest','South','West'][dept%5]});
      }
      d.setDate(d.getDate()+7); i++;
    }
    // Overlay exact CSV sample values where they exist
    RAW.forEach((r,idx)=>{ const rec = makeRecord(r,idx);
      const found = out.find(o=>o.date===rec.date && o.dept===rec.dept);
      if(found) found.sales = rec.sales;
    });
    return out;
  }

  const TIMESERIES = buildTimeseries();

  // Inventory (simulated operational table)
  const INVENTORY = [
    {sku:'WM-EL-1023',name:'Wireless Earbuds Pro',dept:'Electronics',stock:1240,reorder:800,turnover:7.2,forecast:980,status:'Healthy'},

  ];

  // Customers (segments)
  const CUSTOMERS = [
    {segment:'Value Seekers',share:34,avgSpend:82,retention:71,trend:+3.2},
    {segment:'Families',share:26,avgSpend:148,retention:83,trend:+1.8},
    {segment:'Convenience',share:19,avgSpend:56,retention:64,trend:-2.1},
    {segment:'Premium',share:12,avgSpend:221,retention:89,trend:+5.4},
    {segment:'Occasional',share:9,avgSpend:39,retention:41,trend:-4.7},
  ];

  // AI insights (rule-based demo; swap for real model endpoint)
  function generateInsights(){
    const latest = TIMESERIES.filter(r=>r.date >= '2012-08-01');
    const holidayRows = latest.filter(r=>r.isHoliday);
    const avgHoliday = holidayRows.reduce((a,b)=>a+b.sales,0)/Math.max(holidayRows.length,1);
    const avgNormal = latest.filter(r=>!r.isHoliday).reduce((a,b)=>a+b.sales,0)/Math.max(latest.filter(r=>!r.isHoliday).length,1);
    const lift = avgNormal ? ((avgHoliday/avgNormal -1)*100) : 0;
    return [
      {icon:'📈',color:'cyan',title:'Holiday lift detected',
       body:`Holiday weeks are running ${lift.toFixed(1)}% above baseline. Allocate extra inventory and staffing for the next holiday cycle.`,
       conf:'Confidence: 92%'},
      {icon:'⚠️',color:'warn',title:'Low-stock risk — Seasonal & Grocery',
       body:'WM-SE-3391 (Patio Heater) and WM-GR-2210 (Organic Coffee) are below reorder points. Suggested reorder within 5 days.',
       conf:'Confidence: 88%'},
      {icon:'📊',color:'teal',title:'Premium segment accelerating',
       body:'Premium customers grew 5.4% in share with 89% retention. Consider an exclusive loyalty tier to capture high spend.',
       conf:'Confidence: 81%'},
      {icon:'🧠',color:'cyan',title:'Sales forecast next 4 weeks',
       body:'Model projects a 6–9% week-over-week increase driven by seasonal demand in Seasonal & Toys departments.',
       conf:'Confidence: 76%'},
    ];
  }

  // Filters: dynamic date range
  function filtered(rangeDays){
    if(rangeDays === 'all') return TIMESERIES;
    const days = parseInt(rangeDays,10);
    const maxDate = new Date(TIMESERIES[TIMESERIES.length-1].date);
    const cutoff = new Date(maxDate); cutoff.setDate(cutoff.getDate() - days);
    return TIMESERIES.filter(r => new Date(r.date) >= cutoff);
  }

  // KPIs from filtered data
  function kpis(rows){
    const totalRevenue = rows.reduce((a,b)=>a+b.sales,0);
    const totalSales = rows.filter(r=>r.sales>0).length;
    const totalTransactions = Math.round(totalSales * 1.6 + rows.length*0.4);
    const profitMargin = 24.6 + (rows.length % 7)*0.3;
    return {totalRevenue, totalSales, totalTransactions, profitMargin};
  }

  // Aggregations
  function byMonth(rows){
    const m = {};
    rows.forEach(r=>{ const k=r.date.slice(0,7); m[k]=(m[k]||0)+r.sales; });
    return Object.entries(m).sort().map(([k,v])=>({label:k,value:+v.toFixed(0)}));
  }
  function byRegion(rows){
    const m={};
    rows.forEach(r=>{ m[r.region]=(m[r.region]||0)+r.sales; });
    return Object.entries(m).map(([k,v])=>({label:k,value:+v.toFixed(0)}));
  }
  function byDept(rows){
    const m={};
    rows.forEach(r=>{ m[r.department]=(m[r.department]||0)+r.sales; });
    return Object.entries(m).map(([k,v])=>({label:k,value:+v.toFixed(0)})).sort((a,b)=>b.value-a.value);
  }
  function forecast(rows, weeks=8){
    const monthly = byMonth(rows);
    if(monthly.length < 3) return [];
    const last = monthly.slice(-6);
    const avg = last.reduce((a,b)=>a+b.value,0)/last.length;
    const growth = 1.03;
    const out=[];
    const start = new Date(monthly[monthly.length-1].label+'-01');
    for(let i=1;i<=weeks;i++){
      const d = new Date(start); d.setMonth(d.getMonth()+i);
      out.push({label:d.toISOString().slice(0,7), value:+(avg*Math.pow(growth,i)).toFixed(0)});
    }
    return out;
  }

  // Search / drill
  function search(q){
    q=q.toLowerCase();
    return TIMESERIES.filter(r=> r.department.toLowerCase().includes(q) || r.date.includes(q) || r.region.toLowerCase().includes(q));
  }

  return {TIMESERIES, INVENTORY, CUSTOMERS, generateInsights, filtered, kpis, byMonth, byRegion, byDept, forecast, search};
})();

  const k = DataLayer.kpis(rows);

    {label:'Total Revenue', value:'$'+fmt(k.totalRevenue), trend:revGrowth, icon:'💰', color:CHART_COLORS.cyan},

    </div>`).join('')}</div>`;
}

function fmt(n){
  if(n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if(n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString(undefined,{maximumFractionDigits:0});
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

/* =========================================================
   PAGE MOUNT & CHART WIRING
   ========================================================= */
const PAGES = {
  overview: {title:'Executive Overview', crumb:'Home / Executive Overview', render:pageOverview},
  sales: {title:'Sales Analytics', crumb:'Home / Sales Analytics', render:pageSales},
  inventory: {title:'Inventory Analytics', crumb:'Home / Inventory Analytics', render:pageInventory},
  customer: {title:'Customer Analytics', crumb:'Home / Customer Analytics', render:pageCustomer},
  ai: {title:'AI Insights', crumb:'Intelligence / AI Insights', render:pageAI},
  strategic: {title:'Strategic Analytics', crumb:'Intelligence / Strategic Analytics', render:pageStrategic},
  data: {title:'Data Management', crumb:'Data / Data Management', render:pageData},
};

let currentPage = 'overview';

function go(page){
  if(!PAGES[page]) return;
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===page));
  document.getElementById('pageTitle').textContent = PAGES[page].title;
  document.getElementById('pageCrumb').textContent = PAGES[page].crumb;
  renderCurrent();
  window.scrollTo({top:0, behavior:'smooth'});
  if(window.innerWidth <= 860) sidebar.classList.remove('mobile-open');
}

function renderCurrent(){
  const content = document.getElementById('content');
  const rows = DataLayer.filtered(document.getElementById('dateRange').value);
  content.innerHTML = `<div class="page active">${PAGES[currentPage].render(rows)}</div>`;
  wirePage(currentPage, rows);
}

/* ---- Wire charts + tables for each page ---- */
function wirePage(page, rows){
  // clean old chart refs
  Object.keys(chartRegistry).forEach(destroyChart);

  if(page==='overview') wireOverview(rows);
  if(page==='sales') wireSales(rows);
  if(page==='inventory') wireInventory(rows);
  if(page==='customer') wireCustomer(rows);
  if(page==='ai') wireAI(rows);
  if(page==='strategic') wireStrategic(rows);
}

function wireOverview(rows){
  const months = DataLayer.byMonth(rows);
  const regions = DataLayer.byRegion(rows);
  const dept = DataLayer.byDept(rows);
  const total = dept.reduce((a,b)=>a+b.value,0);

  makeChart('chOverviewRevenue',{
    type:'line',
    data:{labels:months.map(m=>m.label),
      datasets:[{
        label:'Revenue', data:months.map(m=>m.value),
        borderColor:CHART_COLORS.cyan, backgroundColor:hexA(CHART_COLORS.cyan,.12),
        fill:true, tension:.4, borderWidth:2.5, pointRadius:0, pointHoverRadius:5,
        pointHoverBackgroundColor:CHART_COLORS.cyan,
      }]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      interaction:{intersect:false,mode:'index'}, scales:baseScales}
  });

  makeChart('chOverviewRegion',{
    type:'doughnut',
    data:{labels:regions.map(r=>r.label),
      datasets:[{data:regions.map(r=>r.value),
        backgroundColor:[CHART_COLORS.blue,CHART_COLORS.cyan,CHART_COLORS.teal,CHART_COLORS.warn,CHART_COLORS.good],
        borderColor:'#101a2e', borderWidth:3, hoverOffset:8}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{legend:{position:'bottom', labels:{padding:12, pointStyle:'circle'}}}}
  });

  const holidayRows = rows.filter(r=>r.isHoliday);
  const nonHol = rows.filter(r=>!r.isHoliday);
  makeChart('chOverviewPerf',{
    type:'bar',
    data:{labels:months.slice(-8).map(m=>m.label),
      datasets:[
        {label:'Holiday weeks', data:months.slice(-8).map((m,i)=> holidayRows.length? Math.round(holidayRows[i%holidayRows.length].sales):0),
          backgroundColor:hexA(CHART_COLORS.warn,.7), borderRadius:6},
        {label:'Regular weeks', data:months.slice(-8).map((m,i)=> nonHol.length? Math.round(nonHol[i%nonHol.length].sales):0),
          backgroundColor:hexA(CHART_COLORS.blue,.7), borderRadius:6},
      ]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{padding:14, pointStyle:'rectRounded'}}},
      scales:{x:{...baseScales.x, stacked:false}, y:{...baseScales.y, stacked:false}}}
  });

  const tbody = document.getElementById('overviewDeptTable');
  if(tbody){
    tbody.innerHTML = dept.slice(0,8).map((d,i)=>{
      const share = total? (d.value/total*100):0;
      return `<tr onclick="showToast('Drill-down: ${d.label}','🔍','ok')">
        <td><b>#${i+1}</b></td>
        <td>${d.label}</td>
        <td style="font-weight:700;color:${CHART_COLORS.cyan}">$${fmt(d.value)}</td>
        <td>${share.toFixed(1)}%</td>
        <td><div class="bar-mini"><i style="width:${share}%"></i></div></td>
      </tr>`;
    }).join('');
  }
}

function wireSales(rows){
  const months = DataLayer.byMonth(rows);
  const dept = DataLayer.byDept(rows);
  const regions = DataLayer.byRegion(rows);
  const fc = DataLayer.forecast(rows, 6);

  // Trend + forecast
  const histLabels = months.map(m=>m.label);
  const fcLabels = fc.map(f=>f.label);
  const histData = months.map(m=>m.value);
  const fcData = new Array(months.length-1).fill(null);
  fcData.push(histData[histData.length-1]);
  fc.forEach(f=>fcData.push(f.value));
  makeChart('chSalesTrend',{
    type:'line',
    data:{labels:[...histLabels, ...fcLabels],
      datasets:[
        {label:'Historical revenue', data:[...histData, ...new Array(fc.length).fill(null)],
          borderColor:CHART_COLORS.cyan, backgroundColor:hexA(CHART_COLORS.cyan,.1), fill:true, tension:.4, borderWidth:2.5, pointRadius:0},
        {label:'AI forecast', data:fcData,
          borderColor:CHART_COLORS.warn, borderDash:[6,5], tension:.4, borderWidth:2.5, pointRadius:3,
          pointBackgroundColor:CHART_COLORS.warn, fill:false}
      ]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{padding:14}}},
      interaction:{intersect:false,mode:'index'}, scales:baseScales}
  });

  // Dept bar
  makeChart('chSalesDept',{
    type:'bar',
    data:{labels:dept.map(d=>d.label),
      datasets:[{data:dept.map(d=>d.value),
        backgroundColor:dept.map((_,i)=> i<3? CHART_COLORS.cyan : hexA(CHART_COLORS.blue,.65)),
        borderRadius:7, hoverBackgroundColor:CHART_COLORS.teal}]},
    options:{responsive:true, maintainAspectRatio:false, indexAxis:'y',
      plugins:{legend:{display:false}},
      scales:{x:{...baseScales.y}, y:{grid:{display:false}, ticks:{font:{size:10}}}}}
  });

function wireAI(rows){
  const months = DataLayer.byMonth(rows);
  const fc = DataLayer.forecast(rows, 6);
  const histData = months.map(m=>m.value);
  const fcData = new Array(months.length-1).fill(null);
  fcData.push(histData[histData.length-1]);
  fc.forEach(f=>fcData.push(f.value));

  makeChart('chAIForecast',{
    type:'line',
    data:{labels:[...months.map(m=>m.label), ...fc.map(f=>f.label)],
      datasets:[
        {label:'Actual', data:[...histData, ...new Array(fc.length).fill(null)],
          borderColor:CHART_COLORS.cyan, backgroundColor:hexA(CHART_COLORS.cyan,.1), fill:true, tension:.4, borderWidth:2.5, pointRadius:0},
        {label:'Predicted', data:fcData,
          borderColor:CHART_COLORS.warn, borderDash:[6,5], tension:.4, borderWidth:2.5, pointRadius:3, pointBackgroundColor:CHART_COLORS.warn},
      ]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{padding:14}}},
      interaction:{intersect:false,mode:'index'}, scales:baseScales}
  });

  // Anomaly
  const vals = months.map(m=>m.value);
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
  makeChart('chAIAnomaly',{
    type:'line',
    data:{labels:months.map(m=>m.label),
      datasets:[
        {label:'Sales', data:vals, borderColor:CHART_COLORS.blue, backgroundColor:hexA(CHART_COLORS.blue,.08), fill:true, tension:.4, borderWidth:2, pointRadius:vals.map(v=> Math.abs(v-mean)>1.4*sd?5:0), pointBackgroundColor:CHART_COLORS.bad, pointBorderColor:CHART_COLORS.bad},
        {label:'Expected range', data:months.map(()=>mean+sd), borderColor:hexA(CHART_COLORS.good,.5), borderDash:[4,4], pointRadius:0, borderWidth:1, fill:false},
        {label:'Lower bound', data:months.map(()=>mean-sd), borderColor:hexA(CHART_COLORS.good,.3), borderDash:[4,4], pointRadius:0, borderWidth:1, fill:'-1'},
      ]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:baseScales}
  });

  // Inventory risk
  const inv = DataLayer.INVENTORY;
  makeChart('chAIRisk',{
    type:'bar',
    data:{labels:inv.map(i=>i.name.split(' ').slice(0,2).join(' ')),
      datasets:[{data:inv.map(i=>{
        const ratio = i.stock / Math.max(i.forecast,1);
        return Math.max(5, Math.round((1-ratio)*100));
      }),
        backgroundColor:inv.map(i=>{
          const ratio = i.stock / Math.max(i.forecast,1);
          return ratio<0.6? hexA(CHART_COLORS.bad,.8) : ratio<1? hexA(CHART_COLORS.warn,.8) : hexA(CHART_COLORS.good,.7);
        }), borderRadius:7}]},
    options:{responsive:true, maintainAspectRatio:false, indexAxis:'y',
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>'Stockout risk: '+c.raw+'%'}}},
      scales:{x:{...baseScales.y, max:100, ticks:{callback:v=>v+'%'}}, y:{grid:{display:false}, ticks:{font:{size:10}}}}}
  });
}

// Chat
function sendChat(){
  const input = document.getElementById('chatInput');
  const log = document.getElementById('chatLog');
  const q = input.value.trim();
  if(!q) return;
  log.insertAdjacentHTML('beforeend', `<div class="msg user">${escapeHtml(q)}</div>`);
  input.value='';
  log.scrollTop = log.scrollHeight;
  setTimeout(()=>{
    const reply = answer(q);
    log.insertAdjacentHTML('beforeend', `<div class="msg bot">${reply}</div>`);
    log.scrollTop = log.scrollHeight;
  }, 550);
}
function answer(q){
  q = q.toLowerCase();
  const rows = DataLayer.filtered(document.getElementById('dateRange').value);
  const k = DataLayer.kpis(rows);
  const dept = DataLayer.byDept(rows);
  if(q.includes('revenue') || q.includes('sales') || q.includes('trend')){
    const months = DataLayer.byMonth(rows);
    const last = months[months.length-1];
    const prev = months[months.length-2];
    const chg = prev? ((last.value/prev.value-1)*100).toFixed(1):'N/A';
    return `Total revenue for the selected period is <b style="color:var(--cyan)">$${fmt(k.totalRevenue)}</b>. The latest month shows <b>${chg}%</b> change vs the prior month. The top department is <b>${dept[0].label}</b> at $${fmt(dept[0].value)}.`;
  }
  if(q.includes('inventory') || q.includes('stock') || q.includes('reorder')){
    const low = DataLayer.INVENTORY.filter(i=>i.status!=='Healthy');
    return `I detect <b>${low.length}</b> SKUs at or below reorder thresholds: ${low.map(i=>i.name).join(', ')}. AI recommends reorder within 5 days for critical items (Patio Heater & Organic Coffee).`;
  }
  if(q.includes('forecast') || q.includes('predict')){
    const fc = DataLayer.forecast(rows,4);
    return `The 4-week AI forecast projects revenue of <b style="color:var(--cyan)">$${fmt(fc.reduce((a,b)=>a+b.value,0))}</b>. Confidence: 76%. Holiday weeks are expected to run ~14% above baseline.`;
  }
  if(q.includes('customer') || q.includes('segment') || q.includes('retention')){
    return `Premium customers have the highest retention (89%) and fastest growth (+5.4%). Value Seekers represent the largest share (34%). Consider an exclusive loyalty tier for Premium to capture high spend.`;
  }
  if(q.includes('risk') || q.includes('anomaly') || q.includes('unusual')){
    return `Anomaly detection flags demand spikes in Seasonal & Toys as expected holiday-season behavior. However, <b>WM-SE-3391</b> shows a stockout risk of ~60% in the next 30 days — prioritize replenishment.`;
  }
  return `Based on current data: revenue is <b style="color:var(--cyan)">$${fmt(k.totalRevenue)}</b>, margin is <b>${k.profitMargin.toFixed(1)}%</b>, and the top department is <b>${dept[0].label}</b>. Ask me about revenue trends, inventory risk, forecasts, or customer segments.`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Toast
function showToast(msg, icon='✨', type='ok'){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className='toast';
  const color = type==='ok'?CHART_COLORS.good:type==='warn'?CHART_COLORS.warn:CHART_COLORS.cyan;
  t.innerHTML = `<div class="ic" style="background:${hexA(color,.15)};color:${color}">${icon}</div><div>${escapeHtml(msg)}</div>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(40px)'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

  }
}, 18000);
